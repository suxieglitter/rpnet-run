[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rpnet-run"
version = "0.1.0"
description = "One-command CLI wrapper for RPNet P-wave polarity prediction with SKHASH input generation"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "rpnet>=0.1.0",
    "skhash",
    "numpy",
    "pandas",
    "obspy",
    "parmap",
    "tensorflow",
    "keras-self-attention",
    "tqdm",
]

[project.scripts]
rpnet-run = "rpnet_run.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
